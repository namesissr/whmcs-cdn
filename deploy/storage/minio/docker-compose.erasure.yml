# Pasargad CDN — object storage on 4 disks with erasure coding (SPEC §16.8, docs/STORAGE.md)
#   docker compose -f docker-compose.erasure.yml up -d && ./bootstrap.sh -f docker-compose.erasure.yml
# MinIO stripes every object over the 4 disks (EC:2 by default on 4 drives: any 2 disks may fail
# for reads, usable capacity = half of the raw capacity). One disk per mount point, all the same
# size, XFS, no RAID/LVM below them. Same .env as the single-node file.

services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    command: ["server", "/data{1...4}"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_SERVER_URL: https://${STORAGE_DOMAIN:?set STORAGE_DOMAIN in .env}
      MINIO_SITE_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BROWSER: "off"
    volumes:
      - ${MINIO_DISK1:?set MINIO_DISK1 in .env}:/data1
      - ${MINIO_DISK2:?set MINIO_DISK2 in .env}:/data2
      - ${MINIO_DISK3:?set MINIO_DISK3 in .env}:/data3
      - ${MINIO_DISK4:?set MINIO_DISK4 in .env}:/data4
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-127.0.0.1/32}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  mc:
    image: ${MC_IMAGE:-minio/mc:latest}
    profiles: ["tools"]
    restart: "no"
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    volumes:
      - ./pcdn-controller-policy.json:/policy/pcdn-controller-policy.json:ro
    entrypoint: ["/bin/sh"]
    depends_on:
      - minio

volumes:
  caddy-data:
  caddy-config:
