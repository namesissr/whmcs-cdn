<!doctype html>
<!--
  صفحه وضعیت عمومی «پاسارگاد سی‌دی‌ان» (Pasargad CDN) — SPEC §8.2

  استقرار (Deploy):
    این یک صفحه ایستا و کاملاً مستقل است (بدون CDN/فونت بیرونی). کل پوشه status/
    را روی هر میزبان ایستا آپلود کنید (همان دامنه WHMCS، یک زیردامنه مثل
    status.example.com، آبجکت‌استوریج، GitHub Pages و …).

    این صفحه هر ~۳۰ ثانیه فایل عمومی /status.json کنترلر را می‌گیرد و نمایش می‌دهد.
    مبدأ آدرس به سه روش تعیین می‌شود (به ترتیب اولویت):
      1) پارامتر ?api=  در نشانی صفحه، مثلاً:
             https://status.example.com/?api=https://cdn-api.example.com
      2) ثابت API_BASE در ابتدای فایل status.js
      3) اگر هیچ‌کدام تنظیم نشد: همان مبدأ (origin) که صفحه از آن سرو می‌شود،
         یعنی درخواست به «/status.json» همان دامنه.

    اگر صفحه و کنترلر روی یک دامنه هستند نیازی به تنظیم نیست. در غیر این صورت
    کنترلر باید هدر CORS بدهد (کنترلر برای /status.json این کار را می‌کند) یا
    از ?api= استفاده کنید.
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>وضعیت سرویس‌ها</title>
<meta name="description" content="وضعیت لحظه‌ای سرویس‌های پاسارگاد سی‌دی‌ان">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f9e44' d='M13 2 3 14h9l-1 8 10-12h-9z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="status.css">
</head>
<body>
<main class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <span class="bolt" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
      </span>
      <div>
        <h1>وضعیت سرویس‌ها</h1>
        <p class="sub">پاسارگاد سی‌دی‌ان</p>
      </div>
    </div>
    <button type="button" class="refresh" id="refresh" title="به‌روزرسانی">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
      <span>به‌روزرسانی</span>
    </button>
  </header>

  <!-- بنر وضعیت کلی -->
  <section class="banner banner-loading" id="banner" role="status" aria-live="polite">
    <span class="banner-icon" id="bannerIcon" aria-hidden="true"></span>
    <div class="banner-text">
      <strong id="bannerTitle">در حال دریافت وضعیت…</strong>
      <span class="banner-sub" id="bannerSub"></span>
    </div>
  </section>

  <!-- خطای دریافت -->
  <section class="errbox" id="errbox" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 8v5M12 17h.01"/></svg>
    <span>در حال حاضر نمی‌توان وضعیت را دریافت کرد. تلاش دوباره تا لحظاتی دیگر انجام می‌شود.</span>
  </section>

  <!-- اجزای سرویس -->
  <section class="card" id="componentsCard" hidden>
    <h2 class="card-title">وضعیت اجزا</h2>
    <ul class="components" id="components"></ul>
    <p class="nodes" id="nodes"></p>
  </section>

  <!-- رخدادها -->
  <section class="card" id="incidentsCard" hidden>
    <h2 class="card-title">رخدادها</h2>
    <div id="incidents"></div>
  </section>

  <footer class="foot">
    <span id="updated" class="updated"></span>
    <span class="tick" id="tick"></span>
    <a class="abuse-link" id="abuseLink" href="abuse.html">گزارش تخلف / Report abuse</a>
  </footer>
</main>
<script src="status.js" defer></script>
</body>
</html>
