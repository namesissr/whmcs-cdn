# Pasargad CDN — edge base configuration (http context).
# Installed to /etc/nginx/conf.d/00-pcdn.conf by install.sh.

log_format pcdn escape=json '{"t":"$time_iso8601","h":"$host","b":$bytes_sent,"s":$status,"c":"$upstream_cache_status","ip":"$remote_addr","u":"$request_uri"}';

map $http_upgrade $pcdn_connection_upgrade {
    default upgrade;
    ''      '';
}

# resolves hostname origins (proxied CNAME records) at request time
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

server_names_hash_bucket_size 128;
server_names_hash_max_size 16384;
variables_hash_bucket_size 128;

client_max_body_size 512m;
proxy_http_version 1.1;
proxy_buffering on;
proxy_buffers 32 16k;
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
proxy_next_upstream error timeout;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:pcdn_ssl:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

gzip on;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

# Unknown hosts + health endpoint used by the PowerDNS ifurlup() checks.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    location = /__pcdn/health { return 200 "ok\n"; }
    location / { return 421; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

include /etc/nginx/pcdn/sites/*.conf;
