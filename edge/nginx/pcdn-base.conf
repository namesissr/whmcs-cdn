# Pasargad CDN — edge base configuration (http context).
#
# This is a TEMPLATE: pcdn-agent renders it into {{NGINX_DIR}}/http.conf on every
# config apply (so ports, GeoIP availability and the njs code are swapped in
# atomically with the sites and checked by `nginx -t`). /etc/nginx/conf.d/00-pcdn.conf
# only contains `include /etc/nginx/pcdn/http.conf;`.
# Placeholders (double braces): NGINX_DIR HTTP_PORT HTTPS_PORT RESIZE_PORT RESOLVER
# GEOIP DICT_SIZE HC_INTERVAL CONNECT_TIMEOUT SSL_BUFFER_SIZE SHIELD EARLY_HINTS LISTEN_H2
# HTTPS_DEFAULT_EXTRA. The literal __PCDN_CONFVER__ marker is replaced with the tree digest by the
# agent (F29). IPv6 listen lines are dropped when LISTEN_IPV6=no.
# Module guards (SPEC §14.1): lines between "# @if <module>" and "# @endif <module>" are kept only
# when the agent detected that module (MODULE_FILES in pcdn-agent.py); an optional
# "# @else <module>" part is kept only when it is missing, so an nginx.org build without the
# GeoIP2 / Brotli modules still passes `nginx -t`.

# hash sizes must precede the first map block
server_names_hash_bucket_size 128;
server_names_hash_max_size 16384;
variables_hash_bucket_size 128;
variables_hash_max_size 4096;
map_hash_bucket_size 128;

{{GEOIP}}

# --- njs: per-request security verdict, load balancing, challenge pages
# @if njs
js_path {{NGINX_DIR}}/js;
js_import pcdn from {{NGINX_DIR}}/js/pcdn.js;
js_shared_dict_zone zone=pcdn_cnt:{{DICT_SIZE}} type=number timeout=3600s evict;   # rate-limit / DDoS windows
js_shared_dict_zone zone=pcdn_blk:8m type=number timeout=86400s evict;              # rate-limit blocks, used tokens
js_shared_dict_zone zone=pcdn_hc:1m type=number timeout=3600s;                      # origin health
js_var $pcdn_vmemo;                     # verdict memo, survives internal redirects
js_set $pcdn_verdict pcdn.verdict;
js_set $pcdn_upstream pcdn.upstream;
js_set $pcdn_tn_upstream pcdn.tunnelUpstream;
js_set $pcdn_img_w pcdn.imgW;
js_set $pcdn_img_h pcdn.imgH;
js_set $pcdn_img_q pcdn.imgQ;
# @else njs
# no njs module: security checks, pools and image resizing are off, nginx still starts
map $uri $pcdn_verdict {
    default "ok";
}
map $uri $pcdn_upstream {
    default "";
}
map $uri $pcdn_tn_upstream {
    default "";
}
map $uri $pcdn_img_w {
    default "";
}
map $uri $pcdn_img_h {
    default "";
}
map $uri $pcdn_img_q {
    default "";
}
# @endif njs

# tn: tunnel protocol ("" for normal requests), rt: request time (whole session for tunnels),
# bu: bytes from the client, ub: bytes nginx sent to the origin (see docs/EDGE.md)
log_format pcdn escape=json '{"t":"$time_iso8601","h":"$host","b":$bytes_sent,"s":$status,"c":"$upstream_cache_status","ip":"$remote_addr","cc":"$pcdn_country","m":"$request_method","u":"$request_uri","ua":"$http_user_agent","v":"$pcdn_verdict","tn":"$pcdn_tn","rt":$request_time,"bu":$request_length,"ub":"$upstream_bytes_sent"}';

# Declared here so every config (also one without sites) knows them; site servers and
# tunnel locations override them with `set`.
map $uri $pcdn_site {
    default "";
}
map $uri $pcdn_tn {
    default "";
}
# tunnel path prefix for the session-affinity key (F1): set per tunnel location before
# $pcdn_tn_target is first referenced, so tunnelUpstream() can strip it from $uri.
map $uri $pcdn_tn_prefix {
    default "";
}

# --- tunnel mode: concurrent tunnel SESSIONS per site and per client IP of a site (per edge).
# F13: only the session-opening request is counted (ws/grpc/h2: one slot per session/stream;
# xhttp: only the downlink GET, via $pcdn_tn_isget), so an XHTTP packet-up POST does not consume a
# slot and reaching the limit refuses only NEW sessions instead of tearing down established ones.
# The zones are renamed (…2) because nginx refuses a reload that changes an existing zone's key,
# and `nginx -t` does not catch that.
map $request_method $pcdn_tn_isget {
    default "";
    GET     $pcdn_site;
}
# declared with an empty default so the base config is valid when no tunnel location sets it;
# tunnel locations override it with `set` (same pattern as $pcdn_site / $pcdn_tn).
map $uri $pcdn_tn_ckey {
    default "";
}
map $pcdn_tn_ckey $pcdn_tn_ipkey {
    ""      "";
    default "$pcdn_tn_ckey|$binary_remote_addr";
}
limit_conn_zone $pcdn_tn_ckey zone=pcdn_tn_site2:1m;
limit_conn_zone $pcdn_tn_ipkey zone=pcdn_tn_ip2:32m;

# F40: key the legacy per-IP request limit on the client IP for normal requests only; tunnel
# locations set $pcdn_tn (non-empty) so their key becomes "" and limit_req is skipped entirely
# (no shared-memory lock, no error-level log per excess stream request). The per-site zone is
# rendered under a new name (pcdn_rlk_<id>) for the same key-change-on-reload reason as above.
# Origin shield (SPEC §14.1): requests a shield node accepted from another edge ($pcdn_shield_ok=1)
# were already rate-limited at the visitor-facing edge, so they are skipped here as well.
{{SHIELD}}
map "$pcdn_tn:$pcdn_shield_ok" $pcdn_rl_key {
    ":0"    $binary_remote_addr;
    default "";
}

# F35: cheap, rate-limited 503 for tunnel path prefixes of suspended / over-quota sites, so a
# client reconnect storm does not cost an access-log line or an HTML body on every retry.
limit_req_zone $binary_remote_addr zone=pcdn_cut:10m rate=1r/s;

map $http_upgrade $pcdn_connection_upgrade {
    default upgrade;
    ''      '';
}

# path without the query string (cache key when ignore_query is on)
map $request_uri $pcdn_path {
    ~^([^?]*) $1;
}

# cache-key variants (SPEC §14.1). Only referenced by sites that enable them; maps are lazy.
# cache.key_device: coarse device class of the visitor
map $http_user_agent $pcdn_dev {
    default desktop;
    "~*(?:mobi|iphone|ipod|blackberry|bb10|iemobile|opera mini|windows phone|webos|kaios)" mobile;
}
# image.auto_webp ("accept_key" mode): WebP capability of the client, only for JPEG/PNG URIs.
# This nginx's image_filter keeps the input format (it cannot convert JPEG/PNG to WebP), so the
# edge keys the cache on the flag, passes Accept through to origins that negotiate formats and
# adds "Vary: Accept" to those responses.
map $http_accept $pcdn_accept_webp {
    default 0;
    "~*image/webp" 1;
}
map $uri $pcdn_webp {
    default "";
    "~*\.(?:jpe?g|png)$" $pcdn_accept_webp;
}
map $pcdn_webp $pcdn_webp_vary {
    default "";
    "~." Accept;
}
{{EARLY_HINTS}}

# a literal "$" for header values coming from the panel (nginx has no escape for it)
geo $pcdn_dollar {
    default "$";
}

# resolves hostname origins (proxied CNAME records, pool members) at request time.
# resolver_timeout > nginx's fixed 5 s resend interval (F15) so a single lost query is resent at
# 5 s and 10 s instead of failing the connect with a 502; point RESOLVER at a local caching
# resolver (install.sh writes 127.0.0.53 when systemd-resolved is active) for real failover.
resolver {{RESOLVER}} valid=300s ipv6=off;
resolver_timeout 11s;

client_max_body_size 512m;
proxy_http_version 1.1;
proxy_buffering on;
proxy_buffers 32 16k;
# connect timeouts kept symmetric for proxy_pass and grpc_pass (F12): the grpc default is 60 s and
# would otherwise leave gRPC / h2 / XHTTP tunnel connects hanging for a minute.
proxy_connect_timeout {{CONNECT_TIMEOUT}}s;
grpc_connect_timeout {{CONNECT_TIMEOUT}}s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
proxy_next_upstream error timeout;

# cache open file descriptors + stat() of static files and cache hits: fewer syscalls per
# request, a real win for repeat static files and cache HITs.
open_file_cache max=100000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# faster first byte on TLS: a small initial record avoids buffering ~16k before the client
# sees anything, which helps interactive requests over slow last-mile links. install.sh sets
# SSL_BUFFER_SIZE to 16k on --role tunnel nodes (F14), where throughput beats first-byte latency
# and the value also governs the default_server's pre-SNI ClientHello.
ssl_buffer_size {{SSL_BUFFER_SIZE}};

# many long-lived client connections (tunnel mode: one gRPC connection carries many streams).
# keepalive_timeout is commented out of the distro nginx.conf by install.sh. Tunnel-enabled
# server{} blocks raise these per host (F27/N2); both keepalive_time and keepalive_requests
# trigger a graceful HTTP/2 GOAWAY when reached, so a low value forces periodic reconnects.
keepalive_timeout 75s;
keepalive_requests 100000;          # also caps the streams of one HTTP/2 connection (nginx >= 1.19.7)
http2_max_concurrent_streams 512;
reset_timedout_connection on;

# ssl_protocols / ssl_prefer_server_ciphers / gzip are removed from the distro
# nginx.conf by install.sh so they can live here.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:pcdn_ssl:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

gzip on;
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;                  # level 1 (nginx default) barely compresses; 5 halves CSS/JS for little CPU
gzip_min_length 256;               # don't spend CPU compressing tiny responses
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
# @if brotli
brotli on;
brotli_comp_level 5;
brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
# @endif brotli

# Unknown hosts + health endpoint used by the PowerDNS ifurlup() checks.
# reuseport spreads long-lived tunnel connections across all workers (F4); backlog=65535 lets the
# somaxconn/tcp_max_syn_backlog tuning take effect (F16); so_keepalive detects dead / NAT-expired
# tunnel clients in ~4 min so they release their limit_conn slots (F17). These options go on the
# default_server listen only — per-site `listen <port>;` lines must stay optionless or nginx errors
# with "duplicate listen options". Note: with reuseport a reload can drop the few SYNs sitting in a
# shutting-down worker's accept queue (established connections drain normally).
server {
    listen {{HTTP_PORT}} default_server reuseport backlog=65535 so_keepalive=120s:30s:4;
    listen [::]:{{HTTP_PORT}} default_server reuseport backlog=65535 so_keepalive=120s:30s:4;
    server_name _;
    access_log off;
    location = /__pcdn/health { return 200 "ok\n"; }
    # reload verification (F29): the agent polls this after `nginx -s reload` until it returns the
    # digest of the tree it just wrote; if the master rejected the reload the value stays stale and
    # the agent retries instead of reporting the config applied. Localhost-only (the agent polls it
    # from 127.0.0.1) so the tree digest is not an external enumeration surface.
    location = /__pcdn/confver {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type text/plain;
        return 200 "__PCDN_CONFVER__";
    }
    location / { return 421; }
# @if njs
    # origin health checks for load-balancer pools (runs in worker 0). The interval is
    # longer than the largest pool timeout: njs kills an instance still running at the next tick.
    location @pcdn_periodic {
        js_fetch_timeout 10s;
        js_periodic pcdn.health interval={{HC_INTERVAL}}s;
    }
# @endif njs
}

# HTTPS_DEFAULT_EXTRA: `http2 on;` on nginx >= 1.25.1 (LISTEN_H2 is then empty: "listen ... http2"
# is deprecated there) and, on HTTP/3-capable nodes (SPEC §14.1), the one `listen ... quic reuseport`
# (default_server)
# per address that every site's `listen ... quic` shares.
server {
    listen {{HTTPS_PORT}} ssl{{LISTEN_H2}} default_server reuseport backlog=65535 so_keepalive=120s:30s:4;
    listen [::]:{{HTTPS_PORT}} ssl{{LISTEN_H2}} default_server reuseport backlog=65535 so_keepalive=120s:30s:4;
{{HTTPS_DEFAULT_EXTRA}}
    server_name _;
    ssl_reject_handshake on;
}

# Image resizer: site servers proxy ?width/?height requests here (loopback only);
# the result is cached by the calling site's cache zone.
# @if image_filter
server {
    listen 127.0.0.1:{{RESIZE_PORT}};
    server_name _;
    access_log off;
    location / {
        if ($http_x_pcdn_origin = "") { return 404; }
        rewrite ^(.*)$ $1? break;            # the original is fetched without the resize args
        image_filter resize $http_x_pcdn_w $http_x_pcdn_h;
        image_filter_jpeg_quality $http_x_pcdn_q;
        image_filter_webp_quality $http_x_pcdn_q;
        image_filter_buffer 20M;
        image_filter_interlace on;
        proxy_set_header Host $host;
        proxy_set_header X-Pcdn-Origin "";
        proxy_set_header X-Pcdn-W "";
        proxy_set_header X-Pcdn-H "";
        proxy_set_header X-Pcdn-Q "";
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_pass $http_x_pcdn_origin;
    }
}
# @endif image_filter

include {{NGINX_DIR}}/sites/*.conf;
