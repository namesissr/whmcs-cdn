name: CI

on:
  push:
  pull_request:

jobs:
  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: nginx + modules used on the edges
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx libnginx-mod-http-js libnginx-mod-http-geoip2 \
            libnginx-mod-http-image-filter libnginx-mod-http-brotli-filter python3-pytest
          sudo systemctl stop nginx
          sudo pip install --break-system-packages -q mmdb-writer netaddr
      # nginx -t binds the listen ports, so the tests run as root
      - run: sudo python3 -m pytest -q -p no:cacheprovider edge/tests
      - run: bash -n edge/install.sh && bash -n edge/pcdn-geoip-update.sh

  whmcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: find whmcs -name '*.php' -print0 | xargs -0 -n1 php -l
