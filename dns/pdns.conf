# Pasargad CDN — PowerDNS Authoritative settings
# mounted to /etc/powerdns/pdns.d/pcdn.conf

# proxied records are LUA records that return healthy edge IPs
enable-lua-records=yes
lua-health-checks-interval=5
lua-health-checks-expire-delay=3600
edns-subnet-processing=yes

# HTTP API (used by the controller). Not published on the host in docker-compose;
# on a standalone ns2 restrict it to the controller's IP.
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0,::/0

default-ttl=300
# GeoDNS (optional, see README):
# launch+=geoip
# geoip-database-files=mmdb:/etc/powerdns/GeoLite2-City.mmdb
# geoip-zones-file=/etc/powerdns/geo-zones.yaml
